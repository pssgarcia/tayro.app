name: CD

# Dispara somente quando o workflow CI termina na branch main
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  # ─── API → Railway ────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API → Railway
    runs-on: ubuntu-latest
    # Só faz deploy se o CI passou
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Roda a migration no banco de produção ANTES de subir o novo código.
      # Garante que o schema está atualizado quando o novo código entrar no ar.
      # Requer secret DATABASE_URL configurado em Settings → Secrets do repo.
      - name: Run DB migrations
        run: npm run prisma:deploy --workspace=apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Deploy explícito via CLI: "railway up" sobe o código já checado neste
      # runner (que acabou de passar no CI) e builda no Railway. Rodamos da RAIZ
      # do repo para o lockfile de workspace estar presente; o Railway usa o
      # Root Directory = apps/api configurado no serviço para buildar.
      #
      # Por que "up" e não "redeploy": com o auto-deploy nativo do Railway
      # DESLIGADO (Actions é o único orquestrador), "redeploy" rebuilda o mesmo
      # commit antigo. "up" envia o commit novo.
      #
      # "--ci" faz o passo ESPERAR o build do Railway e sair com o status real —
      # se o build falhar, este job falha junto (sem mais "CD verde / build red").
      #
      # Service ID (não o nome) — imutável e sem ambiguidade. Não é segredo
      # (aparece na URL do painel); o acesso é protegido pelo RAILWAY_TOKEN.
      #
      # VERSÃO PINADA, NÃO TROCAR PARA @latest (mordeu 2026-08-15 a 2026-08-21).
      # O CLI é dependência de terceiro que sai várias vezes por dia; com
      # @latest, um release do Railway quebra o CD sem nenhuma mudança nossa —
      # e foi exatamente o que houve. Correlação versão × resultado:
      #   5.41.1 (latest até 15/08) → último CD verde (14/08)
      #   5.41.2 (latest 15/08–21/08) → 4 falhas seguidas
      #   5.42.1 (latest 21/08)      → falha
      # A partir da 5.41.2, `up --ci` completa o build, publica a imagem e
      # NUNCA RETORNA: fica pendurado até ser morto pelo `timeout`, com o
      # deploy já no ar. Ou seja, CD vermelho com produção atualizada — o pior
      # tipo de falso-negativo, porque mascara uma falha real (a migration, por
      # exemplo, roda no step anterior). Subir de versão = PR próprio, olhando
      # uma run verde antes de mergear.
      #
      # Retry: mantido como rede de segurança pro flake histórico de
      # "Failed to stream build logs" (2026-08-03, ~65s após "CI mode enabled",
      # com o deploy completando normal). Note que ele NÃO salva do modo de
      # falha acima: a 2ª tentativa re-sobe o mesmo snapshot, o Railway pula o
      # build ("no changes detected in watch paths") e o CLI trava sem ter
      # nenhum log pra transmitir. Se as duas tentativas baterem no `timeout`
      # com o job durando ~10m30s certinho, suspeite do CLI antes do código.
      #
      # `timeout` por tentativa porque o retry só dispara se o comando RETORNAR
      # com erro — sem ele o CLI travado segura o job por horas (visto 2026-08-19,
      # run cancelada com 6h). `timeout-minutes` do step é a rede de segurança
      # caso nem o `timeout` mate o processo.
      - name: Deploy API to Railway
        timeout-minutes: 12
        run: |
          for attempt in 1 2; do
            if timeout 300 npx @railway/cli@5.41.1 up --ci --service f0afafae-1cd2-41e2-b462-8c413dd53209; then
              exit 0
            fi
            echo "Tentativa $attempt falhou (possível flake de log-streaming do Railway CLI, ou travou e foi morta pelo timeout)."
          done
          exit 1
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ─── Web → Vercel ─────────────────────────────────────────────────────────────
  deploy-web:
    name: Deploy Web → Vercel
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Deploy via Vercel CLI a partir da RAIZ do repo.
      # O projeto na Vercel já tem "Root Directory = apps/web" configurado,
      # então a CLI aplica esse subdiretório uma única vez. Rodar de dentro de
      # apps/web duplicaria o caminho (apps/web/apps/web) e quebraria o deploy.
      # Para configurar:
      #   1. Crie um projeto na Vercel (vercel.com) com Root Directory = apps/web
      #   2. Gere um token em Settings → Tokens
      #   3. Pegue VERCEL_ORG_ID e VERCEL_PROJECT_ID rodando `vercel link` localmente
      #   4. Adicione os 3 secrets em Settings → Secrets do repositório
      - name: Deploy to Vercel
        run: npx vercel@latest --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

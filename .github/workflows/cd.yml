name: CD

# Dispara somente quando o workflow CI termina na branch main
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

# Dois releases seguidos não podem rodar migration/deploy em paralelo.
concurrency:
  group: cd-production
  cancel-in-progress: false

jobs:
  # ─── Produção: migrations → Vercel (web + API) → smoke test ─────────────────
  # Desde 2026-11-21 (D-24) a API é uma função no MESMO deploy da Vercel que o
  # web. Por isso é um job só, em sequência: com dois jobs em paralelo (como era
  # com o Railway), o código novo podia entrar no ar antes da migration.
  #
  # Ordem segura pra migration ADITIVA. Migration destrutiva continua exigindo
  # dois releases (expand/contract), ver CLAUDE.md → Convenções de trabalho.
  deploy:
    name: Deploy → Vercel (migrations + web + API)
    runs-on: ubuntu-latest
    # Só faz deploy se o CI passou
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v5

      # Mesma major do runtime da função na Vercel (projeto em Node 24.x).
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Migration pelo endpoint DIRETO do Neon, não pelo pooler que a app usa:
      # o `prisma migrate` depende de advisory lock, que o pooler em modo
      # transação não garante. A URL direta é derivada do mesmo secret.
      - name: Run DB migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DIRECT_URL="$(bash .github/scripts/direct-database-url.sh)" || exit 1
          echo "::add-mask::$DIRECT_URL"
          DATABASE_URL="$DIRECT_URL" npm run prisma:deploy --workspace=apps/api

      # Deploy via Vercel CLI a partir da RAIZ do repo. O projeto na Vercel tem
      # "Root Directory = apps/web"; rodar de dentro de apps/web duplicaria o
      # caminho (apps/web/apps/web). O build remoto compila a API também
      # (buildCommand do apps/web/vercel.json).
      #
      # VERSÃO PINADA, NÃO TROCAR PARA @latest: foi o @latest do CLI do Railway
      # que quebrou o CD por semanas sem nenhuma mudança nossa. 66.6.0 é a que
      # fez o deploy da virada (v0.69.0). Subir de versão = PR próprio.
      #
      # Secrets: VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID.
      - name: Deploy to Vercel
        timeout-minutes: 20
        run: npx vercel@66.6.0 --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # O deploy terminar não prova que a API sobe: já foi ao ar uma função
      # que caía no boot por variável faltando (D-24). O /health faz SELECT 1,
      # então valida função + env + banco. Falhou = produção provavelmente
      # quebrada: Instant Rollback no painel da Vercel.
      # Teste: .github/workflows/test/smoke-health.test.sh
      - name: Smoke test da API em produção
        run: bash .github/scripts/smoke-health.sh https://tayro.app.br/api/v1/health

name: CD

# Dispara somente quando o workflow CI termina na branch main
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  # ─── API → Railway ────────────────────────────────────────────────────────────
  deploy-api:
    name: Deploy API → Railway
    runs-on: ubuntu-latest
    # Só faz deploy se o CI passou
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Roda a migration no banco de produção ANTES de subir o novo código.
      # Garante que o schema está atualizado quando o novo código entrar no ar.
      # Requer secret DATABASE_URL configurado em Settings → Secrets do repo.
      - name: Run DB migrations
        run: npm run prisma:deploy --workspace=apps/api
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Dispara o redeploy no Railway — ele puxa o código do GitHub e rebuilda.
      # "railway up" faria upload de arquivos (errado para monorepo).
      # "railway redeploy" apenas aciona o build já configurado no painel do Railway.
      # Usamos o Service ID (não o nome) — imutável e sem ambiguidade de
      # capitalização. ID não é segredo (aparece na URL do painel); o que protege
      # o acesso é o RAILWAY_TOKEN (Project Token, em secrets).
      # Requer: projeto em railway.app com root directory = apps/api.
      - name: Redeploy API on Railway
        run: npx @railway/cli@latest redeploy --service f0afafae-1cd2-41e2-b462-8c413dd53209 --yes
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  # ─── Web → Vercel ─────────────────────────────────────────────────────────────
  deploy-web:
    name: Deploy Web → Vercel
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Deploy via Vercel CLI a partir da RAIZ do repo.
      # O projeto na Vercel já tem "Root Directory = apps/web" configurado,
      # então a CLI aplica esse subdiretório uma única vez. Rodar de dentro de
      # apps/web duplicaria o caminho (apps/web/apps/web) e quebraria o deploy.
      # Para configurar:
      #   1. Crie um projeto na Vercel (vercel.com) com Root Directory = apps/web
      #   2. Gere um token em Settings → Tokens
      #   3. Pegue VERCEL_ORG_ID e VERCEL_PROJECT_ID rodando `vercel link` localmente
      #   4. Adicione os 3 secrets em Settings → Secrets do repositório
      - name: Deploy to Vercel
        run: npx vercel@latest --prod --yes
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

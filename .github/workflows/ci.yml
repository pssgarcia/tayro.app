name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main, develop]

# Cancela o run anterior do mesmo PR/branch quando um novo push chega
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── API ──────────────────────────────────────────────────────────────────────
  api:
    name: API — lint · typecheck · test · build
    runs-on: ubuntu-latest

    # PostgreSQL para testes de integração (e2e futuros)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tayro_test
          POSTGRES_PASSWORD: tayro_test
          POSTGRES_DB: tayro_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://tayro_test:tayro_test@localhost:5432/tayro_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Gera os tipos TypeScript do Prisma Client a partir do schema
      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=apps/api

      # Aplica migrations no banco de teste (garante schema atualizado)
      - name: Apply migrations
        run: npm run prisma:deploy --workspace=apps/api

      - name: Lint
        run: npm run lint --workspace=apps/api

      - name: Typecheck
        run: npm run typecheck --workspace=apps/api

      - name: Test
        run: npm test --workspace=apps/api

      - name: Build
        run: npm run build --workspace=apps/api

  # ─── Web ──────────────────────────────────────────────────────────────────────
  web:
    name: Web — lint · typecheck · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=apps/web

      - name: Typecheck
        run: npm run typecheck --workspace=apps/web

      - name: Test
        run: npm test --workspace=apps/web

      - name: Build
        run: npm run build --workspace=apps/web

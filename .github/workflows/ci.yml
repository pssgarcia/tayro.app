name: CI

on:
  push:
    branches: ['**']

# push já cobre toda branch (repo sem fork) - pull_request duplicava o run pro mesmo commit
# e a ruleset de required status checks bloqueava o merge com um check CANCELLED ao lado do SUCCESS.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── API ──────────────────────────────────────────────────────────────────────
  api:
    name: API — lint · typecheck · test · build
    runs-on: ubuntu-latest

    # PostgreSQL para testes de integração (e2e futuros)
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tayro_test
          POSTGRES_PASSWORD: tayro_test
          POSTGRES_DB: tayro_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    env:
      DATABASE_URL: postgresql://tayro_test:tayro_test@localhost:5432/tayro_test
      # Testes *.integration.spec.ts (store do throttle) rodam contra este banco
      # descartável. Sem a variável eles FALHAM no CI (não pulam em silêncio).
      INTEGRATION_DATABASE_URL: postgresql://tayro_test:tayro_test@localhost:5432/tayro_test
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Scripts que o CD roda em produção (smoke test, URL direta do Neon).
      # Só eram exercitados no merge da main; aqui quebram no PR.
      - name: Test CD scripts
        run: |
          bash .github/workflows/test/smoke-health.test.sh
          bash .github/workflows/test/direct-database-url.test.sh

      # Gera os tipos TypeScript do Prisma Client a partir do schema
      - name: Generate Prisma Client
        run: npm run prisma:generate --workspace=apps/api

      # Aplica migrations no banco de teste (garante schema atualizado)
      - name: Apply migrations
        run: npm run prisma:deploy --workspace=apps/api

      - name: Lint
        run: npm run lint --workspace=apps/api

      - name: Typecheck
        run: npm run typecheck --workspace=apps/api

      - name: Test
        run: npm test --workspace=apps/api

      - name: Build
        run: npm run build --workspace=apps/api

  # ─── Web ──────────────────────────────────────────────────────────────────────
  web:
    name: Web — lint · typecheck · test · build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint --workspace=apps/web

      - name: Typecheck
        run: npm run typecheck --workspace=apps/web

      - name: Test
        run: npm test --workspace=apps/web

      - name: Build
        run: npm run build --workspace=apps/web
